# ===================================
#  Form Field Definitions
# ===================================

fields:
    title:
        label: Title
        type: text

    short_description:
        label: Short Description
        type: textarea
        size: small

    description:
        label: Detailed Description
        type: textarea
        size: large

    category:
        label: Category
        type: relation
        nameFrom: name
        required: true

    image:
        label: Service Image
        type: fileupload
        mode: image
        imageWidth: 300
        imageHeight: 200
        fileTypes: jpg,jpeg,png,webp
        maxFiles: 1

    is_active:
        label: Active
        type: switch
        default: true

    display_order:
        label: Display Order
        type: number
        default: 0