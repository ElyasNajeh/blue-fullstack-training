fields:
    title:
        label: Title
        type: text
        required: true

    slug:
        label: Slug
        type: text
        required: true

    description:
        label: Short Description
        type: textarea
        size: small
        required: true

    category:
        label: Category
        type: relation
        nameFrom: name
        required: true

    file:
        label: Document File
        type: fileupload
        mode: file
        maxFiles: 1
        fileTypes: pdf,doc,docx,xls,xlsx,ppt,pptx

    status:
        label: Status
        type: dropdown
        options:
            draft: Draft
            published: Published
        default: draft
        required: true

    published_at:
        label: Publication Date
        type: datepicker
        mode: datetime