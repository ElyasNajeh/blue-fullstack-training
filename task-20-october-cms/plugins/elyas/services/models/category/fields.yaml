# ===================================
#  Form Field Definitions
# ===================================

fields:
    name:
        label: Name
        type: text
        required: true

    slug:
        label: Slug
        type: text
        required: true

    is_active:
        label: Active
        type: switch
        default: true

    display_order:
        label: Display Order
        type: number
        default: 0
        required: true