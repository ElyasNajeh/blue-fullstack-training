# ===================================
#  Form Behavior Config
# ===================================

# Record name
name: Service

# Model Form Field configuration
form: $/elyas/services/models/service/fields.yaml

# Model Class name
modelClass: Elyas\Services\Models\Service

# Default redirect location
defaultRedirect: elyas/services/services

# Create page
create:
    title: backend::lang.form.create_title
    redirect: elyas/services/services/update/:id
    redirectClose: elyas/services/services

# Update page
update:
    title: backend::lang.form.update_title
    redirect: elyas/services/services
    redirectClose: elyas/services/services

# Preview page
preview:
    title: backend::lang.form.preview_title
