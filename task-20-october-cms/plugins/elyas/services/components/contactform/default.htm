<div class="contact-form-wrapper">

    <div id="contact-result"></div>

    <form data-request="contactForm::onSubmit" data-request-validate data-request-flash>

        <div class="form-group">
            <label>Name</label>
            <input type="text" name="name" value="{{ post('name') }}">
            <span class="form-error" data-validate-for="name"></span>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" value="{{ post('email') }}">
            <span class="form-error" data-validate-for="email"></span>
        </div>

        <div class="form-group">
            <label>Subject</label>
            <input type="text" name="subject" value="{{ post('subject') }}">
            <span class="form-error" data-validate-for="subject"></span>
        </div>

        <div class="form-group">
            <label>Message</label>
            <textarea name="message" rows="6">{{ post('message') }}</textarea>
            <span class="form-error" data-validate-for="message"></span>
        </div>

        <button type="submit" data-attach-loading>
            Send Message
        </button>

    </form>

</div>
